<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>US Citizenship Test · Flash Cards (Official 51 Questions)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-image: url("the setting sun.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, 'Roboto', sans-serif;
            padding: 2rem;
        }

        .flashcard-app {
            width: 1000px;
            max-width: 90vw;
            background: rgba(30, 40, 50, 0.3);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.3);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 10px;
        }
        .back-home {
            background: rgba(255,255,240,0.9);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            color: #1e3a5f;
            transition: 0.2s;
        }
        .back-home:hover {
            background: white;
        }
        .progress {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 8px 24px;
            border-radius: 40px;
            color: #fef9e3;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .flashcard {
            background: rgba(255, 250, 240, 0.98);
            border-radius: 2rem;
            min-height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 2rem;
            box-shadow: 0 20px 30px -10px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,245,220,0.8);
        }
        .flashcard:hover {
            transform: translateY(-5px);
            box-shadow: 0 28px 35px -12px rgba(0,0,0,0.25);
        }
        .card-inner {
            padding: 2.5rem;
            width: 100%;
        }
        .card-label {
            font-size: 1rem;
            background: #f0e6d2;
            display: inline-block;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            color: #7b4a2e;
            font-weight: 600;
            margin-bottom: 1.2rem;
            letter-spacing: 1px;
        }
        .card-text {
            font-size: 1.8rem;
            font-weight: 550;
            color: #2c3e2f;
            line-height: 1.4;
            word-break: break-word;
        }
        .flip-hint {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #a57c5c;
            opacity: 0.8;
        }

        .nav-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin: 1.5rem 0 0.5rem;
        }
        .btn {
            background: rgba(255,250,235,0.95);
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
            color: #2c4b36;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-primary {
            background: #4a6a3b;
            color: white;
        }
        .btn-primary:hover {
            background: #2e4a23;
            transform: translateY(-2px);
        }
        .btn-outline {
            background: rgba(255,248,235,0.95);
            border: 1px solid #cbbfaa;
        }
        .btn-outline:hover {
            background: white;
            transform: translateY(-2px);
        }
        .btn-shuffle {
            background: #e0c8a8;
            color: #4a3b28;
        }
        .btn-shuffle:hover {
            background: #d4b48c;
            transform: translateY(-2px);
        }
        footer {
            font-size: 0.8rem;
            text-align: center;
            margin-top: 1.5rem;
            color: #efebd0;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
        }
        @media (max-width: 550px) {
            .flashcard-app {
                padding: 1rem;
                width: 95vw;
            }
            .card-text {
                font-size: 1.2rem;
            }
            .btn {
                padding: 6px 12px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
<div class="flashcard-app">
    <div class="top-bar">
        <a href="index.html" class="back-home">← Back to Home</a>
        <div class="progress" id="progressIndicator">Card 1 / 51</div>
    </div>

    <div class="flashcard" id="flashcard">
        <div class="card-inner">
            <div class="card-label" id="sideLabel">📖 Question</div>
            <div class="card-text" id="cardText">Loading...</div>
            <div class="flip-hint">👇 Click to flip</div>
        </div>
    </div>

    <div class="nav-buttons">
        <button class="btn btn-outline" id="prevBtn">◀ Previous</button>
        <button class="btn btn-outline" id="randomBtn">🎲 Random</button>
        <button class="btn btn-outline" id="nextBtn">Next ▶</button>
        <button class="btn btn-primary" id="flipBtn">🔄 Flip</button>
        <button class="btn btn-shuffle" id="shuffleBtn">♻️ Shuffle</button>
    </div>
    <footer>📌 Cards shuffled on each visit | Click card or press Space to flip | Arrow keys to navigate</footer>
</div>

<script>
    const ORIGINAL_CARDS = [
        { front: "What is the supreme law of the land?", back: "the Constitution" },
        { front: "What does the Constitution do?", back: "sets up the government / defines the government / protects basic rights of Americans" },
        { front: "The idea of self-government is in the first three words of the Constitution. What are these words?", back: "We the People" },
        { front: "What is an amendment?", back: "a change (to the Constitution) / an addition (to the Constitution)" },
        { front: "What do we call the first ten amendments to the Constitution?", back: "the Bill of Rights" },
        { front: "What is one right or freedom from the First Amendment?*", back: "speech / religion / assembly / press / petition the government" },
        { front: "How many amendments does the Constitution have?", back: "twenty-seven (27)" },
        { front: "What did the Declaration of Independence do?", back: "announced our independence (from Great Britain) / declared our independence (from Great Britain) / said that the United States is free (from Great Britain)" },
        { front: "What are two rights in the Declaration of Independence?", back: "life / liberty / pursuit of happiness" },
        { front: "What is freedom of religion?", back: "You can practice any religion, or not practice a religion." },
        { front: "What is the economic system in the United States?*", back: "capitalist economy / market economy" },
        { front: "What is the 'rule of law'?", back: "Everyone must follow the law. / Leaders must obey the law. / Government must obey the law. / No one is above the law." },
        { front: "Name one branch or part of the government.*", back: "Congress / legislative / President / executive / the courts / judicial" },
        { front: "What stops one branch of government from becoming too powerful?", back: "checks and balances / separation of powers" },
        { front: "Who is in charge of the executive branch?", back: "the President" },
        { front: "Who makes federal laws?", back: "Congress / Senate and House (of Representatives) / (U.S. or national) legislature" },
        { front: "What are the two parts of the U.S. Congress?*", back: "the Senate and House (of Representatives)" },
        { front: "How many U.S. Senators are there?", back: 100" },
        { front: "We elect a U.S. Senator for how many years?", back: "6" },
        { front: "The House of Representatives has how many voting members?", back: "435" },
        { front: "We elect a U.S. Representative for how many years?", back: "2" },
        { front: "Who does a U.S. Senator represent?", back: "all people of the state" },
        { front: "Why do some states have more Representatives than other states?", back: "because of the state's population / because they have more people / because some states have more people" },
        { front: "In what month do we vote for President?*", back: "November" },
        { front: "If the President can no longer serve, who becomes President?*", back: "the Vice President" },
        { front: "If both the President and the Vice President can no longer serve, who becomes President?*", back: "the Speaker of the House" },
        { front: "Who is the Commander in Chief of the military?*", back: "the President" },
        { front: "Who signs bills to become laws?*", back: "the President" },
        { front: "Who vetoes bills?*", back: "the President" },
        { front: "What does the President's Cabinet do?*", back: "advises the President" },
        { front: "What are two Cabinet-level positions?", back: "Secretary of Agriculture / Secretary of Commerce / Secretary of Defense / Secretary of Education / Secretary of Energy / Secretary of Health and Human Services / Secretary of Homeland Security / Secretary of Housing and Urban Development / Secretary of the Interior / Secretary of Labor / Secretary of State / Secretary of Transportation / Secretary of the Treasury / Secretary of Veterans Affairs / Attorney General / Vice President" },
        { front: "What does the judicial branch do?", back: "reviews laws / explains laws / resolves disputes (disagreements) / decides if a law goes against the Constitution" },
        { front: "What is the highest court in the United States?*", back: "the Supreme Court" },
        { front: "How many justices are on the Supreme Court?", back: "9" },
        { front: "Under our Constitution, some powers belong to the federal government. What is one power of the federal government?", back: "to print money / to declare war / to create an army / to make treaties" },
        { front: "Under our Constitution, some powers belong to the states. What is one power of the states?", back: "provide schooling and education / provide protection (police) / provide safety (fire departments) / give a driver's license / approve zoning and land use" },
        { front: "What is the capital of your state?*", back: "Answers will vary. [District of Columbia residents should answer that D.C. is not a state and does not have a capital. Residents of U.S. territories should name the capital of the territory.]" },
        { front: "What are the two major political parties in the United States?*", back: "Democratic and Republican" },
        { front: "There are four amendments to the Constitution about who can vote. Describe one of them.", back: "Citizens eighteen (18) and older (can vote). / You don't have to pay (a poll tax) to vote. / Any citizen can vote. (Women and men can vote.) / A male citizen of any race (can vote)." },
        { front: "What is one responsibility that is only for United States citizens?*", back: "serve on a jury / vote in a federal election" },
        { front: "Name one right only for United States citizens.", back: "vote in a federal election / run for federal office" },
        { front: "What are two rights of everyone living in the United States?", back: "freedom of expression / freedom of speech / freedom of assembly / freedom to petition the government / freedom of religion / the right to bear arms" },
        { front: "What do we show loyalty to when we say the Pledge of Allegiance?", back: "the United States / the flag" },
        { front: "What is one promise you make when you become a United States citizen?", back: "give up loyalty to other countries / defend the Constitution and laws of the United States / obey the laws of the United States / serve in the U.S. military (if needed) / serve (do important work for) the nation (if needed) / be loyal to the United States" },
        { front: "How old do citizens have to be to vote for President?*", back: "18 and older" },
        { front: "What are two ways that Americans can participate in their democracy?", back: "vote / join a political party / help with a campaign / join a civic group / join a community group / give an elected official your opinion on an issue / call Senators and Representatives / publicly support or oppose an issue or policy / run for office / write to a newspaper" },
        { front: "When is the last day you can send in federal income tax forms?*", back: "April 15" },
        { front: "When must all men register for the Selective Service?", back: "at age 18 / between 18 and 26" }
    ];

    let cards = [];
    let currentIndex = 0;
    let showAnswer = false;

    // Fisher-Yates shuffle
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initCards() {
        cards = shuffleArray(ORIGINAL_CARDS.map(c => ({ ...c })));
    }

    const flashcardDiv = document.getElementById('flashcard');
    const cardTextEl = document.getElementById('cardText');
    const sideLabelEl = document.getElementById('sideLabel');
    const progressIndicator = document.getElementById('progressIndicator');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const randomBtn = document.getElementById('randomBtn');
    const flipBtn = document.getElementById('flipBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');

    function renderCurrentCard() {
        const card = cards[currentIndex];
        if (showAnswer) {
            sideLabelEl.innerText = "🔍 Answer (back)";
            cardTextEl.innerText = card.back;
        } else {
            sideLabelEl.innerText = "❓ Question (front)";
            cardTextEl.innerText = card.front;
        }
        progressIndicator.innerText = `Card ${currentIndex+1} / ${cards.length}`;
    }

    function refresh() {
        renderCurrentCard();
    }

    function toggleFlip() {
        showAnswer = !showAnswer;
        renderCurrentCard();
    }

    function prevCard() {
        currentIndex = (currentIndex - 1 + cards.length) % cards.length;
        showAnswer = false;
        refresh();
    }

    function nextCard() {
        currentIndex = (currentIndex + 1) % cards.length;
        showAnswer = false;
        refresh();
    }

    function randomCard() {
        let newIndex = Math.floor(Math.random() * cards.length);
        if (cards.length > 1 && newIndex === currentIndex) {
            newIndex = (newIndex + 1) % cards.length;
        }
        currentIndex = newIndex;
        showAnswer = false;
        refresh();
    }

    function shuffleDeck() {
        const currentCard = cards[currentIndex];
        cards = shuffleArray(cards);
        const newIndex = cards.findIndex(c => c.front === currentCard.front && c.back === currentCard.back);
        currentIndex = newIndex !== -1 ? newIndex : 0;
        showAnswer = false;
        refresh();
    }

    // Event listeners
    flashcardDiv.addEventListener('click', toggleFlip);
    prevBtn.addEventListener('click', prevCard);
    nextBtn.addEventListener('click', nextCard);
    randomBtn.addEventListener('click', randomCard);
    flipBtn.addEventListener('click', toggleFlip);
    shuffleBtn.addEventListener('click', shuffleDeck);

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') { e.preventDefault(); prevCard(); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); nextCard(); }
        else if (e.key === ' ' || e.key === 'Space') { e.preventDefault(); toggleFlip(); }
        else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); randomCard(); }
        else if (e.key === 's' || e.key === 'S') { e.preventDefault(); shuffleDeck(); }
    });

    // Initialization
    initCards();
    currentIndex = 0;
    showAnswer = false;
    refresh();
</script>
</body>
</html>
