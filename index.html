<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE TEST · Flash Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url("the setting sun.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 0 1.5rem;
        }

        .title-wrapper {
            margin-top: 8vh;
            text-align: center;
        }

        .main-title {
            font-size: 4.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #0a2f44;           /* 深蓝色，与夕阳暖色形成对比 */
            text-shadow: 2px 2px 8px rgba(255, 215, 150, 0.6); /* 暖色柔光 */
        }

        .button-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-button {
            background: rgba(255, 250, 240, 0.95); /* 暖白半透明 */
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            padding: 1.6rem 2rem;
            width: 280px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 25px 35px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 200, 0.8);
            text-align: center;
        }

        .card-button:hover {
            transform: translateY(-6px);
            background: rgba(255, 245, 235, 1);
            box-shadow: 0 30px 40px -14px rgba(0, 0, 0, 0.3);
        }

        .card-button span {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #2c5a7a, #1e3e5c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        @media (max-width: 500px) {
            .title-wrapper {
                margin-top: 6vh;
            }
            .main-title {
                font-size: 2.8rem;
            }
            .card-button {
                width: 240px;
                padding: 1.2rem 1.5rem;
            }
            .card-button span {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="title-wrapper">
        <h1 class="main-title">FREE TEST</h1>
    </div>
    <div class="button-wrapper">
        <div class="card-button">
            <span>📇 Flash card</span>
        </div>
    </div>
</body>
</html>
