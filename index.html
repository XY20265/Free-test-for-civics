<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE TEST · Flash Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url("the setting sun.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;     /* 垂直居中整个内容区域 */
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, 'Roboto', sans-serif;
            padding: 0 1.5rem;
        }

        .home-container {
            text-align: center;
            width: 100%;
            max-width: 600px;
            /* 不再设置 margin-top，整体自然垂直居中 */
        }

        .main-title {
            font-size: 4.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: white;
            text-shadow: 4px 4px 12px rgba(0, 0, 0, 0.3);
            margin-bottom: 3rem;    /* 标题与按钮的间距，稍微大一点更舒服 */
        }

        .card-button {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            padding: 1.6rem 2rem;
            width: 280px;
            margin: 0 auto;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 25px 35px -12px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.7);
        }

        .card-button:hover {
            transform: translateY(-6px);
            box-shadow: 0 30px 40px -14px rgba(0, 0, 0, 0.35);
            background: white;
        }

        .card-button:active {
            transform: translateY(2px);
        }

        .card-button span {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1e3c72, #2b4f8c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        @media (max-width: 500px) {
            .main-title {
                font-size: 2.8rem;
                margin-bottom: 2rem;
            }
            .card-button {
                width: 240px;
                padding: 1.2rem 1.5rem;
            }
            .card-button span {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="home-container">
        <h1 class="main-title">FREE TEST</h1>
        <div class="card-button">
            <span>📇 Flash card</span>
        </div>
    </div>
</body>
</html>
